<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d1310">
  <title>Yori — Community</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.5' fill='%233390ec'/%3E%3Cpath d='M12 4.6c-4.1 0-7.4 2.7-7.4 6.1 0 2.1 1.2 4 3 5.2l-1.2 3.6 4-2.1c.5.1 1.1.2 1.6.2 4.1 0 7.4-2.7 7.4-6.1S16.1 4.6 12 4.6z' fill='white'/%3E%3C/svg%3E">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('yori-theme') || 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ======================= AUTH ======================= -->
  <div id="auth" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-head">
        <span class="wordmark">yori<span class="dot"></span></span>
        <p class="auth-sub" id="authSub">Sign in to continue</p>
      </div>

      <form id="authForm" autocomplete="on">
        <div class="field">
          <label for="authUser">Username</label>
          <input id="authUser" name="username" autocomplete="username" spellcheck="false" maxlength="20" placeholder="username" autofocus>
        </div>
        <div class="field">
          <label for="authPass">Password</label>
          <input id="authPass" name="password" type="password" autocomplete="current-password" placeholder="password">
        </div>
        <button class="btn primary wide" type="submit" id="authSubmit">Sign in</button>
        <p class="auth-error" id="authError"></p>
      </form>

      <p class="auth-alt">
        <span id="authAltText">New here?</span>
        <button type="button" class="linklike" id="authToggle">Create an account</button>
      </p>
      <p class="auth-note" id="authNote">Usernames are 5-20 characters.</p>
    </div>
  </div>

  <!-- ======================= APP ======================= -->
  <div id="app" class="app hidden">

    <aside id="sidebar" class="side">
      <div class="side-head">
        <span class="wordmark">yori<span class="dot"></span></span>
        <button id="themeBtn" class="icon-btn" title="Theme" aria-label="Toggle theme"></button>
      </div>

      <nav id="roomList" class="room-list"></nav>

      <div class="side-foot">
        <div class="me-card" id="meCard"></div>
        <button id="adminBtn" class="icon-btn hidden" title="Admin" aria-label="Admin panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <main id="main" class="main">
      <header class="chat-head">
        <button id="menuBtn" class="icon-btn only-mobile" title="Chats" aria-label="Chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="head-info" id="headInfo" title="Chat info">
          <div class="head-avatar" id="headAvatar"></div>
          <div class="head-text">
            <div class="head-name" id="headName"></div>
            <div class="head-sub" id="headSub"></div>
          </div>
        </div>
        <div class="head-actions">
          <button id="shareBtn" class="icon-btn" title="Copy invite link" aria-label="Copy invite link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
        </div>
      </header>

      <div id="pinBar" class="pin-bar hidden" title="Jump to pinned message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16h14v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v3.76z"/></svg>
        <div class="pin-texts">
          <span class="pin-label">Pinned</span>
          <span class="pin-preview" id="pinPreview"></span>
        </div>
      </div>

      <div id="messages" class="chat"></div>

      <button id="newPill" class="new-pill hidden" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>
        New messages
      </button>

      <div id="typingLine" class="typing-line hidden">
        <span class="dots"><i></i><i></i><i></i></span><span id="typingText"></span>
      </div>

      <footer class="composer">
        <div id="editBar" class="edit-bar hidden">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          <span>Editing</span>
          <button id="cancelEdit" class="btn small ghost" type="button">Cancel</button>
        </div>
        <div id="mutedBar" class="muted-bar hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Only admins can post in this channel</span>
        </div>
        <div id="composerRow" class="composer-row">
          <button id="emojiBtn" class="emoji-btn" title="Emoji" type="button" aria-label="Emoji">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </button>
          <button id="mediaBtn" class="emoji-btn media-btn" title="Add image or video link" type="button" aria-label="Add media link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Message" maxlength="4000"></textarea>
          <button id="sendBtn" class="send-btn" title="Send" type="button" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
        <div id="acAnchor" class="ac-anchor"></div>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
