<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#17212b">
  <title>Yori Forum</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233390ec'/%3E%3Cstop offset='1' stop-color='%236a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Cpath d='M12 4c-4.4 0-8 2.9-8 6.5 0 2 1.1 3.8 2.8 5L5.4 20l4.1-2.1c.8.2 1.6.3 2.5.3 4.4 0 8-2.9 8-6.5S16.4 4 12 4z' fill='white'/%3E%3C/svg%3E">
  <script>
    // Apply saved theme before first paint (no flash).
    try { document.documentElement.dataset.theme = localStorage.getItem('yori-theme') || 'dark'; } catch (e) {}
  </script>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ======================= AUTH SCREEN ======================= -->
  <div id="auth" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="white"><path d="M12 3C7 3 3 6.4 3 10.6c0 2.3 1.2 4.3 3.2 5.7L5 21l4.6-2.4c.8.2 1.6.3 2.4.3 5 0 9-3.4 9-7.6S17 3 12 3z"/></svg>
      </div>
      <h1 class="auth-title">Yori Forum</h1>
      <p class="auth-sub">Your own channel &amp; group. No bans, no algorithms — just your people.</p>

      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Log in</button>
        <button class="tab" data-tab="register" type="button">Create account</button>
      </div>

      <form id="authForm" autocomplete="on">
        <div class="field">
          <label for="authUser">Username</label>
          <input id="authUser" name="username" autocomplete="username" spellcheck="false" maxlength="20" placeholder="e.g. harshi">
        </div>
        <div class="field">
          <label for="authPass">Password</label>
          <input id="authPass" name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn primary wide" type="submit" id="authSubmit">Log in</button>
        <p class="auth-hint" id="authHint">No email, no phone number — just a username and a password.</p>
        <p class="auth-error" id="authError"></p>
      </form>
    </div>
    <p class="auth-foot">🔒 Passwords are hashed on the server · your data stays on your server</p>
  </div>

  <!-- ======================= MAIN APP ======================= -->
  <div id="app" class="app hidden">

    <aside id="sidebar" class="side">
      <div class="side-head">
        <div class="brand">
          <span class="brand-logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M12 3C7 3 3 6.4 3 10.6c0 2.3 1.2 4.3 3.2 5.7L5 21l4.6-2.4c.8.2 1.6.3 2.4.3 5 0 9-3.4 9-7.6S17 3 12 3z"/></svg></span>
          <span>Yori Forum</span>
        </div>
        <button id="themeBtn" class="icon-btn" title="Toggle theme"></button>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" placeholder="Search chats" spellcheck="false">
      </div>

      <nav id="roomList" class="room-list"></nav>

      <div class="side-foot">
        <div class="me-card" id="meCard"></div>
        <button id="adminBtn" class="icon-btn hidden" title="Admin panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button id="logoutBtn" class="icon-btn" title="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <main id="main" class="main">
      <header class="chat-head">
        <button id="menuBtn" class="icon-btn only-mobile" title="Chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="head-info" id="headInfo" title="Chat info">
          <div class="head-avatar" id="headAvatar"></div>
          <div class="head-text">
            <div class="head-name" id="headName"></div>
            <div class="head-sub" id="headSub"></div>
          </div>
        </div>
        <div class="head-actions">
          <button id="shareBtn" class="icon-btn" title="Copy invite link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          </button>
        </div>
      </header>

      <div id="messages" class="chat"></div>

      <button id="newPill" class="new-pill hidden" type="button">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>
        New messages
      </button>

      <div id="typingLine" class="typing-line hidden">
        <span class="dots"><i></i><i></i><i></i></span><span id="typingText"></span>
      </div>

      <footer class="composer">
        <div id="editBar" class="edit-bar hidden">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          <span>Editing message</span>
          <button id="cancelEdit" class="btn ghost small" type="button">Cancel</button>
        </div>
        <div id="mutedBar" class="muted-bar hidden">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Only admins can post in this channel</span>
        </div>
        <div id="composerRow" class="composer-row">
          <textarea id="input" rows="1" placeholder="Message" maxlength="4000"></textarea>
          <button id="sendBtn" class="send-btn" title="Send" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="/app.js"></script>
</body>
</html>
